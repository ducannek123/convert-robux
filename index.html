<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Robux Shop Convert Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#020617;
    color:#e5e7eb;
}
h2{
    text-align:center;
    color:#38bdf8;
    text-shadow:0 0 12px #38bdf8;
}
.container{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}
.left,.right{
    background:#020617;
    border-radius:12px;
    padding:15px;
    box-shadow:0 0 15px rgba(56,189,248,.3);
}
.left{flex:3}
.right{flex:1}

textarea,input{
    width:100%;
    background:#020617;
    border:1px solid #38bdf8;
    color:#e5e7eb;
    padding:8px;
    border-radius:6px;
}
button{
    width:100%;
    margin-top:8px;
    background:#38bdf8;
    color:#020617;
    border:none;
    padding:10px;
    font-weight:bold;
    border-radius:6px;
    cursor:pointer;
}

#convertedList{
    margin-top:10px;
    border:1px solid #38bdf8;
    border-radius:6px;
    max-height:420px;
    overflow:auto;
}
.item{
    display:grid;
    grid-template-columns:24px 1.5fr 1.5fr .6fr;
    gap:8px;
    padding:6px 8px;
    border-bottom:1px solid rgba(56,189,248,.2);
}
.header{
    font-weight:bold;
    color:#38bdf8;
}
.user{color:#22d3ee}
.service{color:#facc15;font-weight:bold}
.robux{text-align:right;color:#4ade80;font-weight:bold}

.totalBox{
    margin-top:15px;
    background:#020617;
    border:1px solid #38bdf8;
    padding:10px;
    border-radius:6px;
}
</style>
</head>

<body>

<h2>🛒 Robux Shop Convert Tool</h2>

<div class="container">
    <div class="left">
        <h3>Nhập log đơn</h3>
        <textarea id="inputData" rows="6"
        placeholder="Dán toàn bộ log robux vào đây..."></textarea>
        <button onclick="convertData()">Convert</button>

        <div id="convertedList">
            <div class="item header">
                <div></div>
                <div>Username</div>
                <div>Dịch vụ</div>
                <div>Robux</div>
            </div>
        </div>
    </div>

    <div class="right">
        <h3>Robux hiện có</h3>
        <input id="robuxInput" type="number" value="0">
        <div class="totalBox">
            <div>Tổng Robux: <span id="totalRobux">0</span></div>
            <div>Còn dư: <span id="remainRobux">0</span></div>
        </div>
    </div>
</div>

<script>
let convertedData = [];

function normalizeService(text){
    text = text.toUpperCase();
    if(text.includes("+1 SLOT")) return "+1 SLOT";
    if(text.includes("ROCKET")) return "ROCKET";
    if(text.includes("LIGHT")) return "LIGHT";
    if(text.includes("BUDDHA")) return "BUDDHA";
    if(text.includes("PORTAL")) return "PORTAL";
    if(text.includes("FAST BOAT")) return "FAST BOAT";
    if(text.includes("LIGHTNING")) return "LIGHTNING";
    return text.trim();
}

function convertData(){
    const input = document.getElementById("inputData").value.trim();
    if(!input) return;

    convertedData = [];
    const lines = input.split("\n");

    lines.forEach(line=>{
        line = line.replace(/\s+/g," ").trim();

        // Có OG- mới xử
        if(!line.includes("OG-")) return;

        const parts = line.split(" ");
        const ogIndex = parts.findIndex(p=>p.startsWith("OG-"));
        if(ogIndex === -1) return;

        const username = parts[ogIndex + 1] || "";

        // Robux
        let robux = 0;
        parts.forEach(p=>{
            if(p.startsWith("$R")){
                robux = parseInt(p.replace("$R","")) || 0;
            }
        });

        // Service = từ sau username đến trước $R
        let serviceParts = [];
        for(let i = ogIndex + 2; i < parts.length; i++){
            if(parts[i].startsWith("$R")) break;
            if(parts[i].includes("đ")) continue;
            serviceParts.push(parts[i]);
        }

        const service = normalizeService(serviceParts.join(" "));

        if(username && service && robux){
            convertedData.push({username,service,robux});
        }
    });

    render();
}

function render(){
    const box = document.getElementById("convertedList");
    box.innerHTML = `
        <div class="item header">
            <div></div>
            <div>Username</div>
            <div>Dịch vụ</div>
            <div>Robux</div>
        </div>
    `;

    convertedData.forEach(item=>{
        const row = document.createElement("div");
        row.className = "item";

        const cb = document.createElement("input");
        cb.type="checkbox";
        cb.checked=true;
        cb.dataset.robux=item.robux;
        cb.onchange=updateTotal;

        row.innerHTML += "";
        row.appendChild(cb);

        row.innerHTML += `
            <div class="user">${item.username}</div>
            <div class="service">${item.service}</div>
            <div class="robux">${item.robux}</div>
        `;

        box.appendChild(row);
    });

    updateTotal();
}

function updateTotal(){
    let total = 0;
    document.querySelectorAll("#convertedList input[type=checkbox]")
    .forEach(c=>{
        if(c.checked) total += parseInt(c.dataset.robux);
    });

    const have = parseInt(document.getElementById("robuxInput").value)||0;
    document.getElementById("totalRobux").innerText = total;
    document.getElementById("remainRobux").innerText = have - total;
}

document.getElementById("robuxInput").addEventListener("input",updateTotal);
</script>

</body>
</html>
